# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Chromatic
on:
  push:

env:
  # Install @nulogy/tokens + @nulogy/icons from GitHub Packages
  GITHUB_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # INTENTIONAL!

      - name: Setup mise
        uses: jdx/mise-action@v4.2.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build Storybook
        run: pnpm build:storybook

      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          storybookBuildDir: "storybook-static"
          onlyChanged: true
          # Gate PRs on visual changes: the action exits non-zero when there are
          # unreviewed changes (so the check goes red until reviewed in Chromatic).
          # Pushes to main auto-accept, updating the baseline post-merge.
          autoAcceptChanges: main
